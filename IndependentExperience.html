 ولا يعود.","The prong is a round post fixed at its base, and the stone pushes on it at the seat. We work out how much it takes before it bends and does not come back."),t("قوة المخلب ضد الثني تكبر بسرعة مع سماكته: إذا زادت السماكة 10٪ زادت القوة نحو الثلث. وتقلّ كلما طال المخلب. كل المقارنات بالنسب، لا بأرقام مطلقة.","A prong's strength against bending grows fast with its thickness: 10% more thickness gives about a third more strength. It falls as the prong gets longer. All comparisons are ratios, not absolute figures."),t("المقعد يُقطع على شكل الحجر نفسه: رف تحت الحزام، وجدار عنده، وسقف فوقه. والرسم الصغير يُظهر مقطع المخلب عند المقعد وما بقي منه.","The seat is cut to the shape of the stone itself: a ledge under the girdle, a wall at it, and a roof above it. The small drawing shows the prong's section at the seat and what is left of it."),t("الحدود تتبع السبيكة. في عيار 21 و22: المقعد لا يتعدى ربع السماكة، وعند الثلث ينهار المخلب. وفي عيار 18 و14 والبلاتين، على المقاسات العالمية: المقعد حتى نصف السماكة، وفي المخلب المشترك ربع لكل مقعد.","The limits follow the alloy. In 21k and 22k: the seat goes no deeper than a quarter of the thickness, and at a third the prong collapses. In 18k, 14k and platinum, by international sizes: the seat goes up to half the thickness, and in a shared prong a quarter per seat."),t("السماكة المناسبة للمخلب تتبع الحجر. في عيار 21 و22 أرقام ورشتي: 0.52 ملم لأحجار 1.10، ونحو 1 ملم لحجر 4 ملم، و1.25 إلى 1.3 لماسة 6.5. وفي السبائك الأقسى المقاسات العالمية: 1.0 إلى 1.3 لماسة القيراط، و1.2 فأكثر لحجر القيراطين. ولا مخلب أنحف من 0.45 ملم. والمخلب الأثخن من اللازم بكثير تنبيه لا خطأ.","The right prong thickness follows the stone. In 21k and 22k, my workshop's figures: 0.52 mm for 1.10 mm stones, about 1 mm for a 4 mm stone, and 1.25 to 1.3 for a 6.5 mm diamond. In harder alloys, international sizes: 1.0 to 1.3 for a one-carat diamond, and 1.2 or more for a two-carat stone. No prong is thinner than 0.45 mm."),t("طول المخلب قبل التثبيت: المعتاد أطول     <noscript>يحتاج المختبر إلى تفعيل JavaScript في المتصفح.</noscript>
    <script>
      // Opened by double-click (file://), the browser refuses to load the
      // app's separate files. Say so instead of showing a blank page.
      setTimeout(function () {
        var app = document.getElementById("app");
        if (location.protocol === "file:" && app && !app.firstChild) {
          app.innerHTML =
            '<div style="max-width:560px;margin:15vh auto;padding:0 16px;font:16px/1.8 Tahoma,sans-serif;color:#d4d7dc;background:#111317">' +
            '<h1 style="font-size:20px;color:#d6a24a">هذه النسخة تعمل من خادم ويب فقط</h1>' +
            "<p>المتصفح يمنع صفحة مفتوحة من الحاسوب مباشرة من تحميل ملفاتها المجاورة. ارفع المجلد على الاستضافة، أو افتح النسخة المستقلة «مختبر-منطق-المعدن.html» بنقرة مزدوجة.</p></div>";
          document.body.style.background = "#111317";
        }
      }, 1200);
    </script>
